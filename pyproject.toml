[project]
name = "hookview"
version = "1.0.0"
description = "Real-time webhook log receiver with SSE streaming, SQLite persistence, and live browser UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[all]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.18",
]
